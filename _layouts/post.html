---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% include post-meta.html post=page %}
  </header>

  <div class="prose">
    {% assign local_asset_prefix = '<img src="../assets/' %}
    {% capture public_asset_prefix %}<img src="{{ '/assets/' | relative_url }}{% endcapture %}
    {{ content | replace: local_asset_prefix, public_asset_prefix }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/archive/' | relative_url }}">Back to the archive</a>
  </footer>
</article>
